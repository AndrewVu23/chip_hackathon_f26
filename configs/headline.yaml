# Headline sweep (consumed by pimkv.sweep).
#
# Everything runs on the REALISTIC host map (host-cacheline): the
# host-centric map destroys bank parallelism regardless of
# allocator (an address-map problem the allocator cannot fix), and the
# pim-friendly slab map makes 16-token blocks intrinsically aligned. The
# allocator question lives on channel-interleaved maps.
#
# headline.png  <- steady+spec cells: M1 & M3 vs block size, 3 allocators
# bandwidth.png <- bt=16 cells across all four workloads

common:
  dram: hbm3-pim
  addrmap: host-cacheline
  requests: 1000
  max_batch: 64

cells:
  # block-size sweep, steady + adversarial spec
  - workloads: [steady, spec]
    allocators: [paged, pim-aware, contiguous]
    block_tokens: [4, 8, 16, 32, 64, 128, 256]
    seeds: [0]

  # per-workload bandwidth comparison at the serving-standard block size
  - workloads: [longctx, prefix]
    allocators: [paged, pim-aware, contiguous]
    block_tokens: [16]
    seeds: [0]
    requests: 300
    sample_every: 32
    sample_seqs: 4
