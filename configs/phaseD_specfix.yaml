# Re-run of Phase D's pim-aware spec cells with the B2-recommended
# copy-back adoption (the first pass used separate+splice by mistake).
common:
  dram: hbm3-pim
  addrmap: host-cacheline
  requests: 500
  max_batch: 64
cells:
  - workloads: [spec]
    allocators: [pim-aware]
    block_tokens: [16]
    admission_modes: [oracle, vllm]
    headrooms: [0.6, 0.8, 1.0, 1.3]
    spec_adopts: [copyback]
    seeds: [0]
